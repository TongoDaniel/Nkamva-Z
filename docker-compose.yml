services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: edulink
      POSTGRES_PASSWORD: edulink_dev_2025
      POSTGRES_DB: edulink
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edulink"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
