name: Deploy staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/tongodaniel/nkamva

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:staging
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sync prisma folder       
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "prisma/schema.prisma,prisma/migrations/**"
          target: "/opt/nkamva/staging"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/nkamva/staging
            docker compose pull

            # `schema.prisma` déclare `directUrl` : sans DIRECT_URL dans
            # l'environnement, `migrate deploy` s'arrête sur une P1012 avant même
            # de toucher la base. Le staging attaque son Postgres en direct, sans
            # pooler devant — les deux URL y sont donc la même. On lit quand même
            # DIRECT_URL du .env s'il existe, pour le jour où ce ne sera plus vrai.
            DB_URL="$(grep '^DATABASE_URL=' .env | cut -d= -f2-)"
            DIRECT="$(grep '^DIRECT_URL=' .env | cut -d= -f2- || true)"
            : "${DIRECT:=$DB_URL}"

            docker run --rm \
              --network staging_internal \
              -v $(pwd)/prisma:/prisma \
              -e DATABASE_URL="$DB_URL" \
              -e DIRECT_URL="$DIRECT" \
              node:22-alpine \
              npx --yes prisma@6 migrate deploy --schema=/prisma/schema.prisma
            docker run --rm \
              --network staging_internal \
              -e DATABASE_URL="$DB_URL" \
              -e DIRECT_URL="$DIRECT" \
              -e BOOTSTRAP_ADMIN_PASSWORD="$(grep '^BOOTSTRAP_ADMIN_PASSWORD=' .env | cut -d= -f2-)" \
              ghcr.io/tongodaniel/nkamva:${{ github.sha }} \
              node scripts/bootstrap-admins.mjs
            docker compose up -d
            docker image prune -f