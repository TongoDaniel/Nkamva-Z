name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/tongodaniel/nkamva

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:staging
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sync prisma folder       
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "prisma/schema.prisma,prisma/migrations/**"
          target: "/opt/nkamva/staging"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/nkamva/staging
            docker compose pull
            docker run --rm \
              --network staging_internal \
              -v $(pwd)/prisma:/prisma \
              -e DATABASE_URL="$(grep '^DATABASE_URL=' .env | cut -d= -f2-)" \
              node:22-alpine \
              npx --yes prisma@6 migrate deploy --schema=/prisma/schema.prisma
            docker compose up -d
            docker image prune -f